name: Pull Request

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Set up code
        uses: actions/checkout@v6

      - name: ⎔ Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: 🧪 Run tests
        run: node --test tests/*.test.js
